<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Alumno - IES N°11</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">
    <header class="bg-slate-900 p-4 border-b border-blue-900 flex justify-between items-center">
        <a href="/" class="text-cyan-400 font-bold">&larr; Volver al Inicio</a>
        <h1 class="text-xl font-bold">Portal del Alumno</h1>
        <div></div>
    </header>
    <main class="container mx-auto p-8 max-w-4xl">
        <h2 class="text-3xl font-bold mb-4 text-cyan-400">Mi Estado Académico</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-900 p-6 rounded-xl border border-blue-900/50">
                <h3 class="font-bold text-lg mb-2">Constancias y Certificados</h3>
                <p class="text-sm text-gray-400 mb-4">Solicitá tu certificado de alumno regular en un clic.</p>
                <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Solicitar Constancia</button>
            </div>
            <div class="bg-slate-900 p-6 rounded-xl border border-blue-900/50">
                <h3 class="font-bold text-lg mb-2">Historial de Materias</h3>
                <p class="text-sm text-gray-400 mb-4">Consultá tus calificaciones y materias aprobadas.</p>
                <span class="text-cyan-400 font-semibold text-sm">Ver detalles &rarr;</span>
            </div>
        </div>
    </main>
    <footer class="bg-slate-900 text-center py-4 text-sm text-gray-500">IES N°11 - Jujuy</footer>
</body>
</html>

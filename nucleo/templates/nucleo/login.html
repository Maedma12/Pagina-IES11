<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - IES N°11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ies-dark': '#0f172a',
                        'ies-navy': '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ies-dark text-gray-100 flex flex-col min-h-screen justify-between font-sans">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-[#0a1128] via-[#1e293b] to-[#0f172a] shadow-xl border-b border-blue-900/40 p-4">
        <div class="container mx-auto flex items-center space-x-4">
            <div class="relative w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 p-[2px] shadow-lg flex items-center justify-center">
                <div class="w-full h-full bg-[#111827] rounded-full flex flex-col items-center justify-center text-center">
                    <span class="text-[9px] font-extrabold text-white leading-none">IES</span>
                    <span class="text-[9px] font-bold text-cyan-300 leading-none">11</span>
                </div>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wider text-white">IES N° 11</h1>
                <p class="text-[10px] text-cyan-400 tracking-widest uppercase">Portal Académico</p>
            </div>
        </div>
    </header>

    <!-- FORMULARIO DE LOGIN -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-gradient-to-br from-[#1e293b] to-[#0f172a] rounded-2xl shadow-2xl p-8 border border-blue-900/50">
            
            <div class="text-center mb-8">
                <div class="mx-auto mb-4 w-20 h-20 rounded-full bg-gradient-to-b from-[#1e293b] to-[#0f172a] border-2 border-blue-500/40 shadow-xl flex flex-col items-center justify-center p-2">
                    <span class="text-xl font-black text-white">IES 11</span>
                </div>
                <h2 class="text-2xl font-extrabold text-white">Iniciar Sesión</h2>
                <p class="text-xs text-gray-400 mt-1">Ingrese sus credenciales institucionales</p>
            </div>

            {% if form.errors %}
                <div class="mb-6 p-3 bg-red-900/50 border border-red-700 text-red-200 text-xs rounded-xl text-center">
                    Usuario o contraseña incorrectos. Por favor, intente de nuevo.
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Usuario</label>
                    <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 transition text-sm" placeholder="Ej: admin">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Contraseña</label>
                    <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-400 transition text-sm" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-900/30 text-sm">
                    Acceder al Sistema
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'inicio' %}" class="text-xs text-cyan-400 hover:underline">&larr; Volver al Inicio</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#090d16] text-gray-500 py-6 text-center text-xs border-t border-slate-800">
        © 2026 IES N°11 - San Salvador de Jujuy - Argentina
    </footer>

</body>
</html>

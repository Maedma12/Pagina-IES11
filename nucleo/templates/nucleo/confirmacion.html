<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Datos - IES N°11</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xl bg-[#1e293b] p-8 rounded-2xl border border-cyan-500/40 shadow-2xl">
        <h2 class="text-2xl font-extrabold text-cyan-400 mb-2">Revisión de Datos Extraídos por IA</h2>
        <p class="text-xs text-gray-300 mb-6">Por favor, verifica que la información detectada en el PDF sea correcta antes de dar el alta definitiva en el sistema.</p>
        
        <form action="{% url 'guardar_confirmado' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Nombre Detectado</label>
                <input type="text" name="nombre" value="{{ datos_ia.nombre }}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Duración</label>
                    <input type="text" name="duracion" value="{{ datos_ia.duracion }}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Resolución</label>
                    <input type="text" name="resolucion" value="{{ datos_ia.resolucion }}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Resumen del Plan / Materias Detectadas</label>
                <textarea name="descripcion" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">{{ datos_ia.descripcion }}</textarea>
            </div>
            
            <div class="flex space-x-4 pt-4">
                <a href="{% url 'gestion' %}" class="w-1/2 text-center bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl text-sm font-semibold transition">Cancelar</a>
                <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-sm font-bold transition shadow-lg">Confirmar y Guardar</button>
            </div>
        </form>
    </div>
</body>
</html>
